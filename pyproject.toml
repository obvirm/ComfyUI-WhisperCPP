[project]
name = "obvirm-whisperxx"
version = "2.1.73"
description = "WhisperCPP for ComfyUI - whisper.cpp with full CPP params, alignment, diarization"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy","tqdm","requests","huggingface-hub","scipy","sherpa-onnx"]

[project.urls]
Repository = "https://github.com/obvirm/ComfyUI-WhisperCPP"
Documentation = "https://github.com/obvirm/ComfyUI-WhisperCPP/wiki"
"Bug Tracker" = "https://github.com/obvirm/ComfyUI-WhisperCPP/issues"

[tool.comfy]
PublisherId = "obvirm"
DisplayName = "ComfyUI-WhisperCPP"
Icon = ""
includes = []

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | whisper.cpp
  | bs_roformer.cpp
  | cpp-annote
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
